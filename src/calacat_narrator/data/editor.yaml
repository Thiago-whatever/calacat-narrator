version: 1
publish_interval_s: 25
queue_capacity: 8
default_ttl_s: 180
max_ttl_s: 180
recency_half_life_s: 120
# Reviewer agent call (ADR-039); on timeout the templated fallback card is published.
review_timeout_s: 15
# Critical topics get less time, but enough for the Reviewer to write both languages:
# at 3 s every goal card fell back to the template (ADR-045).
critical_review_timeout_s: 12
critical_topics:
  - goal
  - red_card
  - penalty
topic_weights:
  goal: 1.0
  red_card: 1.0
  penalty: 1.0
  shot_volume: 0.75
  pass_streak: 0.65
  pass_milestone: 0.6
  progression: 0.6
  history_goal: 0.8
  history_pass_streak: 0.6
topic_rarity:
  goal: 1.0
  red_card: 1.0
  penalty: 0.95
  shot_volume: 0.65
  pass_streak: 0.7
  pass_milestone: 0.75
  progression: 0.75
  history_goal: 0.9
  history_pass_streak: 0.8
focus_match_relevance: 1.0
focus_other_relevance: 0.65
