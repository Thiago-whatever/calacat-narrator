# Lint, test and build on every PR and push to main (ADR-015). No secrets, no Azure login.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python, Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # No --pre: it would pull pre-releases of every dependency. agent-framework resolves to
      # final releases; the one beta (azure-ai-inference) is pinned upstream, which pip allows.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

      # The runner's Azure CLI compiles Bicep offline; nothing is deployed.
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  web:
    name: Web console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
