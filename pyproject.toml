[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "calacat-narrator"
version = "0.1.0"
description = "Synthetic football event contracts and match intelligence"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-foundry>=1.15,<2",
    "azure-eventhub>=5.12,<6",
    "azure-functions>=1.21,<2",
    "azure-messaging-webpubsubservice>=1.2,<2",
    "azure-identity>=1.17,<2",
    "azure-cosmos>=4.7,<5",
    "azure-servicebus>=7.12,<8",
    "PyYAML>=6,<7",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calacat_narrator = ["data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
# The repo root holds function_app.py, which the HTTP tests import.
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
